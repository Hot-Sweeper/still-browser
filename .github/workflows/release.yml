name: Package native release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v7
        with:
          name: still-native-linux-release
          path: dist/*.tar.xz
          if-no-files-found: error
          retention-days: 14
