name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: npm run dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
          - name: Windows
            os: windows-latest
            command: npm run dist:win
            files: dist/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x

      - run: npm ci
      - run: npm run check
      - run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: still-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --repo "${{ github.repository }}" --generate-notes --verify-tag
