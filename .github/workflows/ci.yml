name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x

      - run: npm ci
      - run: npm run check
      - run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: still-${{ runner.os }}-unpacked
          path: |
            dist/*-unpacked/**
            dist/*-unpacked/**/*
          if-no-files-found: error
          retention-days: 7
