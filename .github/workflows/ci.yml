name: Native CI
on:
  push:
    branches: [main, native-gecko-migration]
  pull_request:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run pack
      - run: python -m pip install -r tests/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool
      - run: xvfb-run -a python tests/native_smoke.py
      - run: xvfb-run -a python tests/native_keys.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-test-results
          path: test-results/*.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: still-native-linux
          path: dist/still-linux-x64/**
          if-no-files-found: error
          retention-days: 7
