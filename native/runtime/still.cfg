// Still native browser bootstrap; this first comment is required by AutoConfig.
(function () {
  const Services = globalThis.Services;
  const root = Services.dirsvc.get('GreD', Ci.nsIFile);
  const ui = root.clone(); ui.append('still');
  const uri = (name) => { const file = ui.clone(); file.append(name); return Services.io.newFileURI(file).spec; };
  Services.io.getProtocolHandler('resource').QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution('still', Services.io.newFileURI(ui));
  defaultPref('browser.startup.page', 3);
  defaultPref('browser.startup.homepage', uri('start.html'));
  defaultPref('browser.aboutwelcome.enabled', false);
  defaultPref('browser.shell.checkDefaultBrowser', false);
  defaultPref('browser.tabs.warnOnClose', true);
  defaultPref('browser.tabs.closeWindowWithLastTab', false);
  defaultPref('browser.tabs.inTitlebar', 1);
  defaultPref('browser.toolbars.bookmarks.visibility', 'never');
  defaultPref('browser.uidensity', 1);
  defaultPref('browser.sessionstore.restore_on_demand', true);
  defaultPref('browser.sessionstore.max_tabs_undo', 20);
  // Still has only five slots; retain their native display lists rather than
  // destroying and rebuilding layers on every switch. Gecko evicts on pressure.
  defaultPref('browser.tabs.remote.tabCacheSize', 5);
  defaultPref('browser.tabs.remote.warmup.enabled', true);
  defaultPref('toolkit.telemetry.reportingpolicy.firstRun', false);
  defaultPref('datareporting.policy.dataSubmissionEnabled', false);
  defaultPref('still.motion', 'elastic');
  // No user-agent overrides, cookie interception, or changes to web security.
  const observer = {
    observe(win) {
      try {
        if (win.document.documentURI !== 'chrome://browser/content/browser.xhtml') return;
        win.StillRootURI = 'resource://still/';
        win.StillStartURI = uri('start.html');
        for (const file of ['model.js', 'effects.js', 'downloader.js', 'browser.js']) Services.scriptloader.loadSubScript('resource://still/' + file, win, 'UTF-8');
      } catch (error) { Cu.reportError('Still bootstrap: ' + error); }
    }
  };
  Services.obs.addObserver(observer, 'browser-delayed-startup-finished');
})();
