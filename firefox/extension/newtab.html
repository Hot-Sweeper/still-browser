<!doctype html>
<html lang="en" data-view="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still</title>
  <link rel="icon" href="still-mark.svg">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main id="page">
    <div class="brand" id="brand" aria-label="Still">
      <img src="still-mark.svg" alt="" width="58" height="58">
      <span>Still</span>
    </div>
    <div class="bar" id="bar">
      <a class="home-mark" id="home-mark" href="newtab.html" title="Still" aria-label="Back to the Still start page">
        <img src="still-mark.svg" alt="" width="34" height="34">
      </a>
      <form id="search-form" autocomplete="off" role="search">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.2 4.2"></path>
          </svg>
          <input id="search-input" autofocus autocomplete="off" spellcheck="false" aria-label="Search or enter an address"
            aria-controls="suggestions" aria-autocomplete="list" placeholder="Search or enter an address">
        </label>
        <div class="suggestions" id="suggestions" role="listbox" hidden></div>
      </form>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Kind of results" hidden>
      <button type="button" role="tab" data-category="general">All</button>
      <button type="button" role="tab" data-category="images">Images</button>
      <button type="button" role="tab" data-category="videos">Videos</button>
      <button type="button" role="tab" data-category="news">News</button>
      <span class="tab-indicator" aria-hidden="true"></span>
    </nav>
    <div class="results-layout" id="layout" hidden>
      <section id="results" aria-live="polite"></section>
      <aside id="infobox" aria-label="About this topic" hidden></aside>
    </div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close preview" title="Close (Esc)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
    </button>
    <button type="button" class="lightbox-step previous" id="lightbox-previous" aria-label="Previous image" title="Previous (Left arrow)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>
    </button>
    <figure>
      <div class="lightbox-frame"><img id="lightbox-image" alt=""></div>
      <figcaption>
        <strong id="lightbox-title"></strong>
        <span id="lightbox-meta"></span>
        <a id="lightbox-open" href="#">Open page</a>
      </figcaption>
    </figure>
    <button type="button" class="lightbox-step next" id="lightbox-next" aria-label="Next image" title="Next (Right arrow)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg>
    </button>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
