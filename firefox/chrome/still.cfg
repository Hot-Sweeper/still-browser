// Still window layer loader. Firefox skips this first line.
// Runs once at startup with chrome privileges (Firefox enterprise autoconfig).
(function stillLoader() {
  try {
    const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
    dir.append("still-chrome");
    if (!dir.exists()) return;
    // install-runtime.js leaves .purgecaches after an update; Firefox has read
    // it by now (it drops its script cache), so remove it for later starts.
    const purge = Services.dirsvc.get("GreD", Ci.nsIFile);
    purge.append(".purgecaches");
    try { if (purge.exists()) purge.remove(false); } catch {}
    const resources = Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler);
    resources.setSubstitution("still", Services.io.newFileURI(dir));

    // Defaults only: anything the user changes in about:config still wins.
    const defaults = {
      "browser.tabs.closeWindowWithLastTab": false,
      "browser.tabs.warnOnClose": false,
      "browser.tabs.loadInBackground": false,
      "browser.tabs.inTitlebar": 1,
      // Keep all five slots painted so switching slides two live pages.
      "browser.tabs.remote.tabCacheSize": 5,
      "browser.tabs.remote.warmup.maxTabs": 5,
      "browser.tabs.remote.warmup.unloadDelayMs": 8000,
      "browser.ctrlTab.sortByRecentlyUsed": false,
      "browser.startup.page": 3,
      // Still never registers itself to start with Windows, and never shows
      // Firefox's welcome or onboarding pages.
      "browser.startup.windowsLaunchOnLogin.enabled": false,
      "browser.startup.windowsLaunchOnLogin.disableLaunchOnLoginPrompt": true,
      "browser.aboutwelcome.enabled": false,
      "startup.homepage_welcome_url": "",
      "startup.homepage_welcome_url.additional": "",
      "trailhead.firstrun.didSeeAboutWelcome": true,
      // No "Pop out this video" button over videos.
      "media.videocontrols.picture-in-picture.video-toggle.enabled": false,
      // Decode video on the GPU (VA-API). Firefox blocklists NVIDIA by
      // default; the launcher supplies the driver setup (see identity.js).
      "media.hardware-video-decoding.force-enabled": true,
      "media.ffmpeg.vaapi.enabled": true,
      // Ctrl+wheel switches slots; it never zooms the page.
      "mousewheel.with_control.action": 0,
      // Native middle-button hold/drag and click-to-latch autoscrolling.
      // Linux's selection-paste otherwise takes precedence over this gesture.
      "general.autoScroll": true,
      "middlemouse.paste": false,
      "apz.autoscroll.enabled": true,
      "general.smoothScroll": true,
      "general.smoothScroll.mouseWheel": true,
      // Native spring physics preserves velocity across wheel notches instead
      // of stitching together short ease-out animations. APZ samples it at vsync.
      "general.smoothScroll.msdPhysics.enabled": true,
      "browser.toolbars.bookmarks.visibility": "never",
      "browser.aboutwelcome.enabled": false,
      "browser.startup.homepage_override.mstone": "ignore",
      "browser.uitour.enabled": false,
      "sidebar.revamp": false,
      "sidebar.verticalTabs": false,
      "browser.tabs.groups.enabled": false,
      "browser.tabs.splitView.enabled": false,
      "browser.tabs.hoverPreview.enabled": false,
      "browser.tabs.insertRelatedAfterCurrent": false,
      "browser.tabs.insertAfterCurrent": false,
      // Startup: no Firefox placeholder window, onboarding, or prompts.
      "browser.startup.preXulSkeletonUI": false,
      "browser.shell.checkDefaultBrowser": false,
      "browser.startup.homepage": "about:newtab",
      "startup.homepage_welcome_url": "",
      "startup.homepage_welcome_url.additional": "",
      "browser.startup.firstrunSkipsHomepage": true,
      "trailhead.firstrun.didSeeAboutWelcome": true,
      "datareporting.policy.dataSubmissionPolicyBypassNotification": true,
      "toolkit.telemetry.reportingpolicy.firstRun": false,
      "browser.messaging-system.whatsNewPanel.enabled": false,
      "browser.newtabpage.activity-stream.feeds.section.topstories": false,
      "extensions.ui.newTabPage.confirmed": true,
      // Less background work at startup: no telemetry, studies, or experiments.
      "datareporting.healthreport.uploadEnabled": false,
      "datareporting.policy.dataSubmissionEnabled": false,
      "toolkit.telemetry.enabled": false,
      "toolkit.telemetry.unified": false,
      "toolkit.telemetry.archive.enabled": false,
      "app.normandy.enabled": false,
      "app.shield.optoutstudies.enabled": false,
      "messaging-system.rsexperimentloader.enabled": false,
      "nimbus.rollouts.enabled": false,
      "browser.discovery.enabled": false,
      "browser.newtabpage.activity-stream.feeds.telemetry": false,
      "browser.newtabpage.activity-stream.telemetry": false,
      "extensions.getAddons.cache.enabled": false,
      "browser.urlbar.quicksuggest.enabled": false,
      // Still's extension is reloaded each start; keep its data and address.
      "extensions.webextensions.keepStorageOnUninstall": true,
      "extensions.webextensions.keepUuidOnUninstall": true
    };
    for (const [name, value] of Object.entries(defaults)) defaultPref(name, value);

    // WebGL frames go to the compositor as DMA-BUF (zero copy) on NVIDIA's
    // proprietary driver when the driver is new enough. Release Firefox blocks
    // this on every NVIDIA driver (bug 1924578: wrong canvas content on 550);
    // Nightly allows it from 580.76.05, and 470.256.02 on the legacy branch
    // (bug 1981326). Still uses Nightly's rule. Without it each WebGL frame is
    // read back through the CPU and uploaded again: a 4K three.js scene ran at
    // ~44 fps instead of ~280 (uncapped, RTX 3080, driver 620).
    // Set gfx.blacklist.dmabuf-webgl to 4 (blocked) in about:config to undo.
    try {
      const version = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      version.initWithPath("/sys/module/nvidia/version");
      if (version.exists()) {
        const input = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
        input.init(version, -1, 0, 0);
        // sysfs files report a fixed size, so read one line instead of a count.
        const line = {};
        input.QueryInterface(Ci.nsILineInputStream).readLine(line);
        input.close();
        const [major, minor, patch] = line.value.trim().split(".").map(Number);
        const atLeast = (a, b, c) => major > a || (major === a && (minor > b || (minor === b && patch >= c)));
        if ((major === 470 && atLeast(470, 256, 2)) || atLeast(580, 76, 5)) {
          // 1 is FEATURE_STATUS_OK. Firefox reads this before its built-in list.
          defaultPref("gfx.blacklist.dmabuf-webgl", 1);
        }
      }
    } catch (error) { Cu.reportError(error); }

    ChromeUtils.registerWindowActor("StillPage", {
      parent: { esModuleURI: "resource://still/StillPageParent.sys.mjs" },
      child: {
        esModuleURI: "resource://still/StillPageChild.sys.mjs",
        events: {
          DOMContentLoaded: {},
          load: { capture: true },
          pageshow: {},
          "still-favicons-request": { wantUntrusted: true, capture: true },
          keydown: { capture: true, mozSystemGroup: true },
          keyup: { capture: true, mozSystemGroup: true },
          // Ctrl+wheel over a page switches slots. Handled here, inside the
          // browser, instead of a system-wide mouse hook. The disabled native
          // Ctrl+wheel action above means this listener can stay passive;
          // ordinary scrolling never waits for Still on the page thread.
          wheel: { capture: true, mozSystemGroup: true, passive: true }
        }
      },
      messageManagerGroups: ["browsers"],
      // Runs inside website processes. It only reads the page background colour,
      // two modifier keys and Ctrl+wheel; the parent side validates every message.
      safeForUntrustedWebProcess: true
    });

    const WINDOW_URL = "chrome://browser/content/browser.xhtml";
    Services.obs.addObserver((subject) => {
      const win = subject;
      if (win.location?.href !== WINDOW_URL) return;
      // chromehidden is not populated yet at browser-window-before-show.
      // Use the window flags and content opener so sign-in windows survive
      // the single-window routing below, including full-toolbar script windows.
      const chromeFlags = win.docShell.treeOwner.QueryInterface(Ci.nsIInterfaceRequestor)
        .getInterface(Ci.nsIAppWindow).chromeFlags;
      if (!(chromeFlags & Ci.nsIWebBrowserChrome.CHROME_TOOLBAR)
          || win.gBrowser?.selectedBrowser?.browsingContext?.opener) return;
      // A slot detached into its own window (Firefox opens it with the tab
      // as its argument) is a Still window too, not a second launch.
      const isDetach = [...Services.wm.getEnumerator("navigator:browser")]
        .some((other) => other !== win && !other.closed && other.StillChrome?.state?.detachingUntil > Date.now());
      // Still is one window. Opening it again while it runs (the taskbar pin,
      // a link from another app, a restored second window) gives any pages
      // to the open window as slots and brings it forward, instead of
      // showing a second window.
      const existing = [...Services.wm.getEnumerator("navigator:browser")]
        .find((other) => other !== win && !other.closed && other.document.documentElement.hasAttribute("still"));
      if (existing && !isDetach) {
        const urls = [];
        const add = (value) => {
          for (const url of String(value || "").split("|")) {
            if (/^(https?|file|ftp):/i.test(url.trim())) urls.push(url.trim());
          }
        };
        const first = win.arguments?.[0];
        try {
          if (first instanceof Ci.nsIArray) {
            for (let i = 0; i < first.length; i++) add(first.queryElementAt(i, Ci.nsISupportsString).data);
          } else if (first instanceof Ci.nsISupportsString) add(first.data);
          else add(first);
        } catch {}
        for (const url of urls) {
          try {
            const tab = existing.gBrowser.addTrustedTab(url);
            existing.gBrowser.selectedTab = tab;
          } catch (error) { Cu.reportError(error); }
        }
        win.setTimeout(() => win.close(), 0);
        existing.focus();
        return;
      }
      try {
        win.windowUtils.loadSheetUsingURIString("resource://still/still-window.css", win.windowUtils.AUTHOR_SHEET);
        // Versioned URL so a cached copy of an older build is never used.
        const script = dir.clone();
        script.append("still-window.js");
        Services.scriptloader.loadSubScript(`resource://still/still-window.js?v=${script.lastModifiedTime}`, win);
        // The side chat (still-chat.js) builds on the window layer.
        win.windowUtils.loadSheetUsingURIString("resource://still/still-chat.css", win.windowUtils.AUTHOR_SHEET);
        const chat = dir.clone();
        chat.append("still-chat.js");
        Services.scriptloader.loadSubScript(`resource://still/still-chat.js?v=${chat.lastModifiedTime}`, win);
      } catch (error) {
        Cu.reportError(error);
      }
    }, "browser-window-before-show");
  } catch (error) {
    Cu.reportError(error);
  }
})();
